# Birding Buddy Streaming Core — local Kafka-compatible broker (Redpanda)
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.5
    container_name: birding-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --smp
      - "1"
      - --memory
      - 1G
      - --mode
      - dev-container
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.5
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk -X brokers=redpanda:9092 topic create bird_sightings_raw \
          --partitions 6 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create target_species_preferences \
          --partitions 3 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create bird_sightings_clean \
          --partitions 6 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create hotspot_activity_metrics \
          --partitions 3 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create species_alerts \
          --partitions 3 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create data_quality_events \
          --partitions 3 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create dead_letter_events \
          --partitions 3 --replicas 1 || true
        echo "Topics ready."
